<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="./manifest.webmanifest">
    <title>Document</title>
</head>
<body>
    <h1 id="titulo1">Exercício 1</h1>
    
    <input type="text" id="nomeDisciplina" placeholder="Ex: Matematica">
    <button onclick="mostrarDisciplina()">Ver disciplina</button>
    <p id="resultado1"></p>


    <h1 id="titulo1">Exercício 2</h1>
    
    <input type="number" id="numero1" placeholder="Ex: 1.26">
    <input type="number" id="numero2" placeholder="Ex: 4.97">
    <button onclick="somar()">Ver a soma</button>
    <p id="resultado2"></p>


    <h1 id="titulo1">Exercício 3</h1>
    
    <input type="number" id="nota1" placeholder="Ex: 7.0">
    <input type="number" id="nota2" placeholder="Ex: 8.0">
    <input type="number" id="nota3" placeholder="Ex: 10.0">
    <input type="number" id="nota4" placeholder="Ex: 7.0">
    <button onclick="verNota()">Ver status</button>
    <p id="resultado3"></p>

    
    <h1 id="titulo1">Exercício 5</h1>
    
    <input type="number" id="tabuada" placeholder="Digite um número inteiro para gerar sua tabuada do 0 ao 10 ">
    <button onclick="atividade5()">Gerar tabuada</button>
    <p id="resultado5"></p>

   
    <h1 id="titulo1">Exercício 6</h1>
    
    <input type="number" id="valorMaior" step="any" placeholder="Digite um valor">
    <button onclick="atividade6()">Adicionar valor</button>
    <p id="resultado6"></p>


    <h1 id="titulo1">Exercício 7</h1>
    
    <button onclick="atividade7()">Mostrar ímpares</button>
    <p id="resultado7"></p>


    <h1 id="titulo1">Exercício 8</h1>
    
    <input type="text" id="nome" placeholder="Digite seu nome">
    <button onclick="atividade8()">Inverter nome</button>    
    <p id="resultado8"></p>

    
    <h1 id="titulo1">Exercício 9</h1>
    
    <input type="text" id="funcNome" placeholder="Nome">
    <input type="number" id="funcIdade" placeholder="Idade">
    <input type="text" id="funcSexo" placeholder="Sexo">
    <input type="number" id="funcSalario" placeholder="Salário">

    <button onclick="adicionarFuncionario()">Adicionar funcionário</button>
    <button onclick="mostrarFuncionarios()">Mostrar acima do salário mínimo</button>   
    <p id="resultado9"></p>



    <h1 id="titulo1">Exercício 10</h1>
    
    <input type="number" id="op1" placeholder="Primeiro número">
    <input type="number" id="op2" placeholder="Segundo número">

    <button onclick="calcular('somar')">Somar</button>
    <button onclick="calcular('subtrair')">Subtrair</button>
    <button onclick="calcular('multiplicar')">Multiplicar</button>
    <button onclick="calcular('dividir')">Dividir</button>
    <p id="resultado10"></p>


    <script src="app.js"></script>
</body>
</html>
